<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Batter's View — v3</title>
<style>
  html,body{margin:0;padding:0;background:#020306;height:100%;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{width:min(100vw,55.26vh);height:auto;display:block;touch-action:manipulation;cursor:pointer}
</style>
</head>
<body>
<canvas id="c" width="420" height="760"></canvas>
<script>
'use strict';
/* ============================================================
   BATTER'S VIEW — v3
   True perspective camera. World units = feet.
   Plate center at origin. +z toward outfield, +x toward first
   base, +y up. (Left-handed world: screen-right ~ +x.)
   ============================================================ */

// ---------- math ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const easeIO=t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeIn=t=>t*t*t;
function mulberry(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const V={
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  norm:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l];},
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  lerp:(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t],
};

// ---------- camera ----------
const CAM_POS=[-3.2,5.6,-0.5];      // batter's eyes, righty box
const CAM_LOOK=[0.5,4.0,55];        // locked on the release point
const FWD=V.norm(V.sub(CAM_LOOK,CAM_POS));
const RIGHT=V.norm(V.cross([0,1,0],FWD)); // screen-right ~ +x (first-base side)
const UPV=V.norm(V.cross(FWD,RIGHT));    // screen-up ~ +y
const W=420,H=760,CX=210,CY=380;
const FOCAL=(H/2)/Math.tan((55*Math.PI/180)/2); // ~730px, 55 deg vertical FOV
function project(p){
  const vx=p[0]-CAM_POS[0], vy=p[1]-CAM_POS[1], vz=p[2]-CAM_POS[2];
  const cx=vx*RIGHT[0]+vy*RIGHT[1]+vz*RIGHT[2];
  const cy=vx*UPV[0]+vy*UPV[1]+vz*UPV[2];
  const cz=vx*FWD[0]+vy*FWD[1]+vz*FWD[2];
  if(cz<0.5) return null;
  return {x:CX+FOCAL*cx/cz, y:CY-FOCAL*cy/cz, s:FOCAL/cz};
}
const ballScreenR=vz=>0.12*FOCAL/vz; // world radius 0.12 ft

// ---------- canvas ----------
let ctx=null, cv=null;
if(typeof document!=='undefined'){
  cv=document.getElementById('c');
  ctx=cv.getContext('2d');
}

// ---------- draw helpers (world space) ----------
function poly3(pts,fill){
  if(!ctx) return;
  ctx.beginPath();
  for(let i=0;i<pts.length;i++){
    const s=project(pts[i]); if(!s) return;
    if(i===0) ctx.moveTo(s.x,s.y); else ctx.lineTo(s.x,s.y);
  }
  ctx.closePath(); ctx.fillStyle=fill; ctx.fill();
}
function seg3(a,b,wFt,style){
  if(!ctx) return;
  const A=project(a),B=project(b); if(!A||!B) return;
  ctx.strokeStyle=style; ctx.lineCap='round';
  ctx.lineWidth=Math.max(0.75,wFt*(A.s+B.s)/2);
  ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke();
}
function dot3(p,rFt,style){
  if(!ctx) return;
  const s=project(p); if(!s) return;
  ctx.fillStyle=style; ctx.beginPath();
  ctx.arc(s.x,s.y,Math.max(0.6,rFt*s.s),0,Math.PI*2); ctx.fill();
}
function ring3(cx,cy,cz,rx,rz,fill,n){
  const pts=[];
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2;pts.push([cx+rx*Math.cos(a),cy,cz+rz*Math.sin(a)]);}
  poly3(pts,fill);
}

// ---------- pitcher pose keyframes ----------
// local coords: feet at y=0. World = local + (0, 0.83, bodyZ).
const JOINTS=['pelvis','chest','head','shT','elT','haT','haG','ftL','ftR'];
const KF=[
 {t:0.00, bodyZ:60.5, ball:[-0.40,4.25,-1.05], j:{
   pelvis:[0,3.0,0], chest:[0,4.9,0], head:[0,5.75,-0.15],
   shT:[0.9,4.85,0], elT:[1.0,4.1,-0.6], haT:[0.85,3.9,-0.9],
   haG:[-0.55,4.1,-0.9], ftL:[-0.7,0,0.1], ftR:[0.7,0,0.3]}},
 {t:0.40, bodyZ:60.5, ball:[0.10,4.90,-0.60], j:{
   pelvis:[0,2.8,0], chest:[0,4.7,0], head:[0,5.55,-0.15],
   shT:[0.9,4.65,0], elT:[1.1,4.6,-0.3], haT:[0.7,4.9,-0.5],
   haG:[-0.5,4.9,-0.7], ftL:[-0.7,0,0.1], ftR:[0.55,2.3,-0.4]}},
 {t:0.75, bodyZ:59.3, ball:[1.05,6.10,0.80], j:{
   pelvis:[0.1,2.6,-0.3], chest:[0.1,4.5,-0.3], head:[0.1,5.35,-0.4],
   shT:[1.0,4.45,-0.3], elT:[1.25,5.2,0.2], haT:[1.05,6.1,0.8],
   haG:[-0.5,4.3,-2.2], ftL:[-0.7,0,0.1], ftR:[0.35,0.5,-2.0]}},
 {t:0.90, bodyZ:57.8, ball:[0.50,3.17,-2.80], j:{   // hand lands exactly on release point
   pelvis:[0.1,2.7,-0.5], chest:[0.1,4.6,-0.6], head:[0.1,5.45,-0.7],
   shT:[1.0,4.7,-0.6], elT:[0.75,4.0,-1.8], haT:[0.5,3.17,-2.8],
   haG:[-0.55,4.2,-2.6], ftL:[-0.45,0.05,2.4], ftR:[0.3,0,-2.3]}},
 {t:1.30, bodyZ:57.6, ball:null, j:{
   pelvis:[0.15,2.7,-0.6], chest:[0.15,4.55,-0.7], head:[0.15,5.4,-0.85],
   shT:[1.0,4.5,-0.6], elT:[0.3,3.9,-1.3], haT:[-0.55,3.3,-1.6],
   haG:[-0.5,4.0,-2.0], ftL:[-0.5,0,0.3], ftR:[0.35,0,-2.2]}},
];
function poseAt(kt){
  let i=0;
  while(i<KF.length-2 && kt>KF[i+1].t) i++;
  const A=KF[i],B=KF[i+1];
  const t=easeIO(clamp((kt-A.t)/(B.t-A.t),0,1));
  const j={};
  for(const k of JOINTS) j[k]=V.lerp(A.j[k],B.j[k],t);
  const ball=A.ball&&B.ball?V.lerp(A.ball,B.ball,t):(B.ball||A.ball);
  return {j, ball, bodyZ:lerp(A.bodyZ,B.bodyZ,t)};
}
const worldOf=(local,bodyZ)=>[local[0],local[1]+0.83,local[2]+bodyZ];

// ---------- pitches ----------
const PITCHES=[
 {type:'FF',mph:98,flight:0.380,aim:[-0.1,3.1],brk:[ 0.3,-0.6],swing:true, contact:null,label:'SWING AND A MISS',      sub:'FF · 98 MPH'},
 {type:'SL',mph:88,flight:0.422,aim:[ 3.2,2.9],brk:[-1.6,-1.1],swing:false,contact:null,label:'BALL',                 sub:'SL · 88 MPH'},
 {type:'FF',mph:97,flight:0.383,aim:[-0.1,3.2],brk:[ 0.2,-0.5],swing:true, contact:'LD', label:'LINE DRIVE — GAP',   sub:'FF · 97 MPH'},
 {type:'CB',mph:82,flight:0.454,aim:[-1.0,3.8],brk:[ 0.8,-1.6],swing:true, contact:'DF', label:'DEEP FLY — WARNING TRACK', sub:'CB · 82 MPH'},
];
const RELEASE=[0.5,4.0,55.0];
function ballPosAt(p,t){
  const be=t<0.6?0:Math.pow((t-0.6)/0.4,3); // late break, t^3 over last 40%
  return [
    RELEASE[0]+(p.aim[0]-RELEASE[0])*t+p.brk[0]*be,
    RELEASE[1]+(p.aim[1]-RELEASE[1])*t+p.brk[1]*be,
    RELEASE[2]+(0.5-RELEASE[2])*t,
  ];
}
const BATTED_V0={LD:[30,22,170],DF:[5,45,110]};

// ---------- state ----------
const S={phase:'beat',t:0,pitchIdx:0,ft:0,flightT:0,kt:0,trail:[],batted:null,swoosh:0,releasePos:null,time:0,resultT:0};
function nextPitch(){S.pitchIdx=(S.pitchIdx+1)%PITCHES.length;S.phase='beat';S.t=0;S.trail=[];S.batted=null;S.swoosh=0;S.releasePos=null;}
function tick(dt){
  S.time+=dt;
  const P=PITCHES[S.pitchIdx];
  switch(S.phase){
    case 'beat':
      S.t+=dt; S.kt=0;
      if(S.t>1.5){S.phase='windup';S.t=0;}
      break;
    case 'windup':
      S.t+=dt; S.kt=lerp(0,0.40,easeIO(clamp(S.t/0.40,0,1)));
      if(S.t>=0.40){S.phase='cock';S.t=0;}
      break;
    case 'cock':
      S.t+=dt; S.kt=lerp(0.40,0.75,easeIO(clamp(S.t/0.35,0,1)));
      if(S.t>=0.35){S.phase='throw';S.t=0;}
      break;
    case 'throw':{
      S.t+=dt; S.kt=lerp(0.75,0.90,easeIn(clamp(S.t/0.15,0,1)));
      if(S.t>=0.15){
        const pose=poseAt(0.90);
        S.releasePos=worldOf(pose.ball,pose.bodyZ); // computed from the hand joint
        S.phase='flight'; S.ft=0; S.flightT=0; S.trail=[];
      }
      break;}
    case 'flight':{
      S.flightT+=dt; S.ft=S.flightT/P.flight;
      S.kt=lerp(0.90,1.30,easeIO(clamp(S.flightT/0.5,0,1)));
      const bp=ballPosAt(P,Math.min(S.ft,1));
      const pr=project(bp);
      if(pr){S.trail.push({x:pr.x,y:pr.y}); if(S.trail.length>8)S.trail.shift();}
      if(P.swing&&S.ft>=0.86) S.swoosh=Math.max(S.swoosh,1-Math.abs(S.ft-0.94)/0.14);
      if(P.contact&&S.ft>=0.95){
        S.phase='batted'; S.t=0;
        S.batted={p:[0,2.6,0],v:BATTED_V0[P.contact].slice()};
        S.trail=[];
      }else if(S.ft>=1){S.phase='result';S.resultT=0;}
      break;}
    case 'batted':{
      S.t+=dt;
      const b=S.batted,dt2=Math.min(dt,0.033);
      b.v[1]-=32*dt2;
      b.p=[b.p[0]+b.v[0]*dt2,b.p[1]+b.v[1]*dt2,b.p[2]+b.v[2]*dt2];
      const pr=project(b.p);
      if(pr){S.trail.push({x:pr.x,y:pr.y}); if(S.trail.length>10)S.trail.shift();}
      if(b.p[1]<0.2||b.p[2]>325||S.t>4){S.phase='result';S.resultT=0;}
      break;}
    case 'result':
      S.resultT+=dt;
      S.kt=1.30+(0-1.30)*easeIO(clamp(S.resultT/0.8,0,1)); // follow-through -> set
      if(S.resultT>(P.contact?0.9:1.2)) nextPitch();
      break;
  }
}
function currentPose(){
  if(S.phase==='beat'){
    const p=poseAt(0);
    p.j.chest=[p.j.chest[0]+0.06*Math.sin(S.time*1.3),p.j.chest[1],p.j.chest[2]];
    return p;
  }
  if(S.phase==='result'&&S.kt<0.9){ // wrap 1.30 -> 0 : blend follow-through back to set
    const a=poseAt(1.30),b=poseAt(0),t=easeIO(clamp((1.30-S.kt)/1.30,0,1));
    const j={}; for(const k of JOINTS) j[k]=V.lerp(a.j[k],b.j[k],t);
    return {j,ball:b.ball,bodyZ:lerp(a.bodyZ,b.bodyZ,t)};
  }
  return poseAt(clamp(S.kt,0,1.30));
}

// ---------- static scenery (seeded) ----------
const rng=mulberry(1337);
const CROWD=[];
for(let i=0;i<150;i++)CROWD.push({x:rng()*420,y:292+rng()*62,r:0.8+rng()*0.9,
  c:['#c95656','#5a7ec9','#c9c9d4','#8a6fc9','#4fae6a'][Math.floor(rng()*5)],a:0.08+rng()*0.25});

// ---------- render ----------
function render(){
  if(!ctx) return;
  // sky
  let g=ctx.createLinearGradient(0,0,0,420);
  g.addColorStop(0,'#04060d');g.addColorStop(0.55,'#0a0f1e');g.addColorStop(1,'#0d1322');
  ctx.fillStyle=g;ctx.fillRect(0,0,420,760);
  // horizon glow
  g=ctx.createRadialGradient(210,360,10,210,360,260);
  g.addColorStop(0,'rgba(255,140,50,0.20)');g.addColorStop(1,'rgba(255,140,50,0)');
  ctx.fillStyle=g;ctx.fillRect(0,180,420,320);
  // light towers
  for(const [tx,tz] of [[-60,300],[95,310]]){
    seg3([tx,0,tz],[tx,70,tz],1.4,'#1a2030');
    const s=project([tx,72,tz]);
    if(s){
      const gl=ctx.createRadialGradient(s.x,s.y,2,s.x,s.y,46);
      gl.addColorStop(0,'rgba(255,250,230,0.85)');gl.addColorStop(0.25,'rgba(255,250,230,0.28)');gl.addColorStop(1,'rgba(255,250,230,0)');
      ctx.fillStyle=gl;ctx.beginPath();ctx.arc(s.x,s.y,46,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,252,240,0.95)';
      for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(s.x-9+i*3.6,s.y-2+(i%2)*4,1.6,0,Math.PI*2);ctx.fill();}
    }
  }
  // crowd band
  ctx.fillStyle='#0b0e18';ctx.fillRect(0,292,420,64);
  for(const d of CROWD){ctx.globalAlpha=d.a;ctx.fillStyle=d.c;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  // scoreboard (deep center)
  poly3([[-40,10,336],[40,10,336],[40,38,336],[-40,38,336]],'#05070c');
  const sb=project([0,30,336]);
  if(sb){ctx.fillStyle='rgba(255,150,60,0.5)';ctx.font='700 9px sans-serif';ctx.textAlign='center';ctx.fillText('B A T T E R ’ S   E Y E',sb.x,sb.y);}
  // outfield wall
  poly3([[-160,0,330],[160,0,330],[160,8,330],[-160,8,330]],'#0d3320');
  seg3([-160,8,330],[160,8,330],0.35,'#c9a227');
  const m399=project([0,4.2,330]);
  if(m399){ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='700 10px sans-serif';ctx.textAlign='center';ctx.fillText('399',m399.x,m399.y+3);}
  // grass
  poly3([[-160,0,14],[160,0,14],[160,0,330],[-160,0,330]],'#123c1e');
  for(let i=0;i<6;i++){
    const z0=14+i*52.6,z1=14+(i+1)*52.6;
    poly3([[-160,0.01,z0],[160,0.01,z0],[160,0.01,z1],[-160,0.01,z1]],
      i%2?'rgba(255,255,255,0.028)':'rgba(0,0,0,0.05)');
  }
  // infield dirt
  poly3([[-50,0.015,40],[50,0.015,40],[50,0.015,130],[-50,0.015,130]],'#5f4128');
  // foul lines
  seg3([-0.71,0.03,0.5],[-140,0.03,290],0.28,'rgba(255,255,255,0.45)');
  seg3([ 0.71,0.03,0.5],[ 140,0.03,290],0.28,'rgba(255,255,255,0.45)');
  // mound: skirt + top + rubber  (the pitcher STANDS on this)
  ring3(0,0.35,60.5,10.5,8.5,'#54371f',20);
  ring3(0,0.83,60.5,9,7,'#6e4b2e',20);
  poly3([[-1,0.87,60.2],[1,0.87,60.2],[1,0.87,60.8],[-1,0.87,60.8]],'#d5d9dd');
  // home dirt (foreground; far edge visible at frame bottom)
  poly3([[-14,0.02,1.5],[14,0.02,1.5],[14,0.02,14],[-14,0.02,14]],'#66452a');
  // chalk: righty box (below frame in a true POV — drawn anyway, correctly placed)
  const chalk='rgba(255,255,255,0.75)';
  seg3([-6,0.04,-3],[-1,0.04,-3],0.22,chalk);
  seg3([-6,0.04, 3],[-1,0.04, 3],0.22,chalk);
  seg3([-1,0.04,-3],[-1,0.04, 3],0.22,chalk);
  // plate at TRUE scale (17in) — sits at/below the bottom edge, as it should
  poly3([[-0.71,0.05,-0.4],[0.71,0.05,-0.4],[0.71,0.05,0.28],[0,0.05,0.85],[-0.71,0.05,0.28]],'rgba(220,224,228,0.9)');

  // ---- pitcher ----
  const pose=currentPose(), bz=pose.bodyZ, J={};
  for(const k of JOINTS) J[k]=worldOf(pose.j[k],bz);
  const SIL='#0c0f14', RIM='rgba(255,150,60,0.20)';
  const limb=(a,b,w)=>{
    seg3(a,b,w+0.14,RIM); seg3(a,b,w,SIL);
  };
  for(const side of [-1,1]){  // legs, two-segment with knees
    const hip=[J.pelvis[0]+side*0.45,J.pelvis[1]-0.05,J.pelvis[2]];
    const foot=side<0?J.ftL:J.ftR;
    const knee=[(hip[0]+foot[0])/2,(hip[1]+foot[1])/2+0.1,(hip[2]+foot[2])/2-0.55];
    limb(hip,knee,0.34); limb(knee,foot,0.30);
    dot3(foot,0.32,SIL);
  }
  limb(J.pelvis,J.chest,0.9);                       // torso
  limb(J.chest,J.head,0.3);                         // neck
  dot3(J.head,0.42,SIL);                            // head
  limb(J.chest,J.haG,0.32);                         // glove arm
  dot3(J.haG,0.55,'#3d2a1c');                        // glove
  limb(J.shT,J.elT,0.30); limb(J.elT,J.haT,0.26);    // throwing arm
  dot3(J.shT,0.34,SIL);
  // held ball (before release)
  if(pose.ball&&(S.phase==='beat'||S.phase==='windup'||S.phase==='cock'||S.phase==='throw')){
    const bw=worldOf(pose.ball,bz), s=project(bw);
    if(s){
      const gl=ctx.createRadialGradient(s.x,s.y,0.5,s.x,s.y,7);
      gl.addColorStop(0,'rgba(255,255,255,0.9)');gl.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=gl;ctx.beginPath();ctx.arc(s.x,s.y,7,0,Math.PI*2);ctx.fill();
      dot3(bw,0.12,'#f5f2ea');
    }
  }

  // ---- ball in flight / batted ----
  const P=PITCHES[S.pitchIdx];
  let ballWorld=null;
  if(S.phase==='flight'){
    ballWorld=ballPosAt(P,Math.min(S.ft,1));
  }else if(S.phase==='batted'&&S.batted){
    ballWorld=S.batted.p;
  }
  if(S.trail.length>1&&ctx){
    for(let i=1;i<S.trail.length;i++){
      const a=S.trail[i-1],b=S.trail[i],al=i/S.trail.length;
      ctx.strokeStyle='rgba(255,200,130,'+(al*0.55).toFixed(2)+')';
      ctx.lineWidth=1+al*2.5;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    }
  }
  if(ballWorld){
    const s=project(ballWorld);
    if(s){
      const rr=clamp(0.12*s.s,0,16);
      const gl=ctx.createRadialGradient(s.x,s.y,0.5,s.x,s.y,rr*4+2);
      gl.addColorStop(0,'rgba(255,255,255,0.95)');gl.addColorStop(0.4,'rgba(255,240,220,0.35)');gl.addColorStop(1,'rgba(255,240,220,0)');
      ctx.fillStyle=gl;ctx.beginPath();ctx.arc(s.x,s.y,rr*4+2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#f5f2ea';ctx.beginPath();ctx.arc(s.x,s.y,Math.max(rr,1.2),0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(200,60,50,0.8)';ctx.lineWidth=Math.max(0.6,rr*0.18);
      ctx.beginPath();ctx.arc(s.x,s.y,Math.max(rr,1.2)*0.7,0.6,2.4);ctx.stroke();
    }
  }
  // bat swoosh on swings
  if(S.swoosh>0.01&&ctx){
    ctx.save();ctx.globalAlpha=clamp(S.swoosh,0,1);
    for(let i=0;i<3;i++){
      ctx.strokeStyle=i===0?'rgba(255,255,255,0.9)':'rgba(255,150,60,'+(0.5-i*0.15).toFixed(2)+')';
      ctx.lineWidth=12-i*4;ctx.lineCap='round';
      ctx.beginPath();ctx.arc(215,660,150-i*14,-Math.PI*0.42,-Math.PI*0.08);ctx.stroke();
    }
    ctx.restore();
    S.swoosh*=0.86;
  }
  // result banner
  if(S.phase==='result'&&ctx){
    const a=S.resultT<0.15?S.resultT/0.15:1;
    ctx.save();ctx.globalAlpha=a;ctx.textAlign='center';
    ctx.fillStyle='#ff9a3c';ctx.font='800 24px -apple-system,Helvetica,Arial,sans-serif';
    ctx.fillText(P.label,210,300);
    ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='600 13px -apple-system,Helvetica,Arial,sans-serif';
    ctx.fillText(P.sub,210,326);
    ctx.restore();
  }
  // vignette
  const vg=ctx.createRadialGradient(210,380,220,210,380,560);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.5)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,420,760);
  // labels
  ctx.textAlign='left';ctx.fillStyle='rgba(255,255,255,0.45)';
  ctx.font='600 11px -apple-system,Helvetica,Arial,sans-serif';
  ctx.fillText("BATTER'S VIEW — v3",12,24);
  if(S.phase==='flight'||S.phase==='batted'||S.phase==='result'){
    ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.fillText(P.sub,408,24);
  }
  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.font='600 12px -apple-system,Helvetica,Arial,sans-serif';
  ctx.fillText('TAP TO THROW',210,742);
}

// ---------- main loop / input ----------
let lastTs=0;
function frame(ts){
  const dt=Math.min(0.05,((ts-lastTs)/1000)||0.016); lastTs=ts;
  tick(dt); render();
  if(typeof requestAnimationFrame!=='undefined') requestAnimationFrame(frame);
}
if(typeof document!=='undefined'&&ctx){
  cv.addEventListener('pointerdown',()=>{
    if(S.phase==='beat'){S.phase='windup';S.t=0;}
    else if(S.phase!=='flight'&&S.phase!=='batted') nextPitch();
  });
  requestAnimationFrame(frame);
}

// ---------- test hooks ----------
if(typeof globalThis!=='undefined'){
  globalThis.__M3={tick,project,ballPosAt,poseAt,worldOf,KF,PITCHES,RELEASE,
    getState:()=>S,nextPitch,ballScreenR,FOCAL,
    handWorldAtRelease:()=>worldOf(KF[3].ball,KF[3].bodyZ)};
}
</script>
