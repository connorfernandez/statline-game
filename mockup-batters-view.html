<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<title>Batter's View — v2 Concept Mockup</title>
<style>
  :root{ --bg:#0b0b10; --txt:#f4f2ec; --dim:#9a97a8; --acc:#ff7a1a; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);min-height:100vh;overscroll-behavior:none;}
  body{display:flex;justify-content:center;align-items:flex-start;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  #wrap{width:100%;max-width:430px;padding:14px 12px 24px;}
  #cvwrap{position:relative;border-radius:18px;overflow:hidden;border:1px solid #262633;
    box-shadow:0 18px 60px rgba(0,0,0,.6);}
  canvas{display:block;width:100%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;}
  .cap{text-align:center;color:var(--dim);font-size:12px;margin-top:12px;letter-spacing:.08em;line-height:1.7;}
  .cap b{color:var(--txt);}
</style>
</head>
<body>
<div id="wrap">
  <div id="cvwrap"><canvas id="cv"></canvas></div>
  <p class="cap">Low batter's-box POV — v2 look &amp; feel only.<br><b>Tap the frame</b> to skip to the next pitch.</p>
</div>
<script>
"use strict";
/* ============ Batter's-view v2: low box POV (no game logic) ============ */
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const LW = 420, LH = 760;
let DPR = 1;

const ACC = "#ff7a1a", TXT = "#f4f2ec", DIM = "#9a97a8";

function sizeCanvas(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = LW * DPR; cv.height = LH * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", sizeCanvas);
sizeCanvas();

const now = () => performance.now();

/* ---------- geometry (low, offset camera) ---------- */
const MX = 185, MY = 352;      // mound: pitcher's feet
const PX = 258, PY = 688;      // home plate center (near foreground, right of center)
const REL = [MX + 12, MY - 42]; // release point = hand at release keyframe (197, 310)
const PLATE_X = 252, PLATE_Y = 648; // where pitches cross

/* ---------- pitch script: whiff / take / contact rotation ---------- */
const SCRIPT = [
  { label:"FF", velo:"98", flight:460, breakX:  10, breakY:  8, outcome:"whiff" },
  { label:"SL", velo:"88", flight:620, breakX: -66, breakY: 20, outcome:"take" },
  { label:"FF", velo:"97", flight:470, breakX:  14, breakY:  8, outcome:"contact", kind:"liner", to:[344, 200], tag:"LINE DRIVE — GAP" },
  { label:"CB", velo:"82", flight:700, breakX:  42, breakY: 36, outcome:"contact", kind:"fly",   to:[116, 168], tag:"DEEP FLY — WARNING TRACK" },
];
const T_LOOK = 1500, T_WIND = 750, T_THROW = 340, T_REL = 210, T_RESET = 1300;

let idx = 0, t0 = 0;
let trail = [];
function startPitch(){ t0 = now(); trail = []; }
startPitch();

cv.addEventListener("pointerdown", e => {
  e.preventDefault();
  idx++; startPitch();
});

/* ---------- helpers ---------- */
function sstep(u){ u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); }
function sampleKeys(keys, t){
  if (t <= keys[0][0]) return [keys[0][1], keys[0][2]];
  for (let i = 1; i < keys.length; i++){
    if (t <= keys[i][0]){
      const a = keys[i-1], b = keys[i];
      const u = sstep((t - a[0]) / (b[0] - a[0]));
      return [a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u];
    }
  }
  const l = keys[keys.length - 1]; return [l[1], l[2]];
}
// deterministic speckles (no shimmer)
const speck = [];
(function(){
  let s = 1234567;
  const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for (let i = 0; i < 60; i++) speck.push([rnd() * LW, 360 + rnd() * 390, 1 + rnd() * 2.2, rnd()]);
})();

/* ---------- static scene ---------- */
function drawSky(){
  const g = ctx.createLinearGradient(0, 0, 0, 190);
  g.addColorStop(0, "#060609"); g.addColorStop(1, "#0c0c13");
  ctx.fillStyle = g; ctx.fillRect(0, 0, LW, 190);
  // stadium light glow
  const rg = ctx.createRadialGradient(LW/2, 96, 8, LW/2, 96, 230);
  rg.addColorStop(0, "rgba(255,190,120,0.10)"); rg.addColorStop(1, "rgba(255,190,120,0)");
  ctx.fillStyle = rg; ctx.fillRect(0, 0, LW, 220);
  // light towers
  [[58, 46], [362, 38]].forEach(([x, y]) => {
    ctx.strokeStyle = "rgba(244,242,236,0.14)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, 108); ctx.stroke();
    ctx.fillStyle = "rgba(255,220,170,0.5)";
    for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++){
      ctx.beginPath(); ctx.arc(x - 9 + c * 9, y - 8 + r * 9, 2.4, 0, 7); ctx.fill();
    }
    const gl = ctx.createRadialGradient(x, y - 4, 2, x, y - 4, 46);
    gl.addColorStop(0, "rgba(255,210,150,0.20)"); gl.addColorStop(1, "rgba(255,210,150,0)");
    ctx.fillStyle = gl; ctx.fillRect(x - 50, y - 54, 100, 100);
  });
  // faint crowd band
  ctx.fillStyle = "rgba(244,242,236,0.045)";
  for (let y = 104; y < 148; y += 9) ctx.fillRect(0, y, LW, 3);
}

function drawWall(){
  ctx.fillStyle = "#12241a"; ctx.fillRect(0, 150, LW, 34);
  ctx.fillStyle = "rgba(255,200,60,0.28)"; ctx.fillRect(0, 150, LW, 2.5); // yellow line
  const ads = ["#1b3a2c", "#243b2a", "#1b3a34", "#2c3a1e", "#1e2c3a"];
  for (let i = 0; i < 5; i++){
    ctx.fillStyle = ads[i]; ctx.globalAlpha = 0.55;
    ctx.fillRect(14 + i * 82, 158, 66, 20);
    ctx.globalAlpha = 1;
  }
}

function drawGrass(){
  const g = ctx.createLinearGradient(0, 184, 0, 352);
  g.addColorStop(0, "#0e1c11"); g.addColorStop(1, "#1e3d27");
  ctx.fillStyle = g; ctx.fillRect(0, 184, LW, 168);
  ctx.fillStyle = "rgba(255,255,255,0.028)"; // mow stripes
  for (let y = 190; y < 350; y += 30) ctx.fillRect(0, y, LW, 13);
}

function drawMoundDirt(){
  ctx.fillStyle = "#3c2a18";
  ctx.beginPath(); ctx.ellipse(MX, MY + 2, 48, 13, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#4a3520";
  ctx.beginPath(); ctx.ellipse(MX, MY - 1, 48, 12, 0, Math.PI, 2 * Math.PI); ctx.fill();
  ctx.fillStyle = "rgba(244,242,236,0.55)"; // rubber
  ctx.fillRect(MX - 9, MY - 8, 18, 4);
}

function drawForeDirt(){
  const g = ctx.createLinearGradient(0, 352, 0, LH);
  g.addColorStop(0, "#33220f"); g.addColorStop(0.5, "#2a1c10"); g.addColorStop(1, "#1d130a");
  ctx.fillStyle = g; ctx.fillRect(0, 352, LW, LH - 352);
  ctx.fillStyle = "rgba(0,0,0,0.20)";
  for (const [x, y, r, a] of speck){
    ctx.globalAlpha = 0.10 + a * 0.12;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // foul lines converging out
  ctx.strokeStyle = "rgba(244,242,236,0.10)"; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(PX, PY - 10); ctx.lineTo(28, 196); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(PX, PY - 10); ctx.lineTo(398, 192); ctx.stroke();
}

function drawChalk(){
  ctx.strokeStyle = "rgba(244,242,236,0.55)"; ctx.lineWidth = 3; ctx.lineCap = "round";
  // batter's box in perspective (offset, low camera)
  ctx.beginPath(); ctx.moveTo(95, LH); ctx.lineTo(185, 505); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(362, LH); ctx.lineTo(312, 492); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(185, 505); ctx.lineTo(312, 492); ctx.stroke();
}

function drawPlate(){
  const w = 38;
  ctx.fillStyle = "#e8e6df";
  ctx.beginPath();
  ctx.moveTo(PX - w, PY - 12); ctx.lineTo(PX + w, PY - 12);
  ctx.lineTo(PX + w, PY + 4); ctx.lineTo(PX, PY + 18); ctx.lineTo(PX - w, PY + 4);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,0.28)";
  ctx.fillRect(PX - w, PY - 12, w * 2, 4);
  ctx.strokeStyle = "rgba(255,122,26,0.30)"; ctx.lineWidth = 1.5;
  ctx.stroke();
}

function drawZone(hot){
  ctx.save();
  ctx.setLineDash([6, 6]);
  ctx.strokeStyle = hot ? "rgba(244,242,236,0.55)" : "rgba(244,242,236,0.20)";
  ctx.lineWidth = 2;
  ctx.strokeRect(PLATE_X - 34, 566, 68, 88);
  ctx.restore();
}

/* ---------- pitcher rig ---------- */
const WINDUP_KEYS = [[0, MX + 16, MY - 30], [T_WIND, MX + 8, MY - 54]];
const THROW_KEYS  = [
  [0, MX + 8, MY - 54], [90, MX + 30, MY - 70],
  [T_REL, REL[0], REL[1]], [T_THROW, MX - 16, MY - 22]
];

function drawMiniBall(x, y, r){
  ctx.save();
  ctx.shadowColor = "rgba(255,255,255,0.6)"; ctx.shadowBlur = 8;
  ctx.fillStyle = "#f4f2ec";
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.restore();
}

function drawPitcher(st){
  // st: {hand:[x,y], lift, crouch, gloveTap, ballIn: 'glove'|'hand'|null}
  const hipY = MY - 36 + st.crouch, shY = MY - 54 + st.crouch;
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath(); ctx.ellipse(MX, MY + 5, 26, 7, 0, 0, 7); ctx.fill();

  ctx.strokeStyle = "#14141b"; ctx.lineCap = "round";
  ctx.lineWidth = 7; // back leg
  ctx.beginPath(); ctx.moveTo(MX, hipY); ctx.lineTo(MX - 11, MY); ctx.stroke();
  const fx = MX + 14 + 10 * st.lift, fy = MY - 36 * st.lift; // front leg
  ctx.beginPath(); ctx.moveTo(MX, hipY); ctx.lineTo(fx, fy); ctx.stroke();

  ctx.fillStyle = "#17171f"; // torso
  ctx.beginPath();
  ctx.moveTo(MX - 10, shY); ctx.lineTo(MX + 10, shY);
  ctx.lineTo(MX + 8, hipY); ctx.lineTo(MX - 8, hipY);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(MX + 1, shY - 13, 7, 0, 7); ctx.fill(); // head

  ctx.strokeStyle = "rgba(255,122,26,0.5)"; ctx.lineWidth = 1.6; // rim light
  ctx.beginPath(); ctx.arc(MX + 1, shY - 13, 7, -1.2, 0.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(MX + 10, shY); ctx.lineTo(MX + 8, hipY); ctx.stroke();

  const gx = MX - 17, gy = shY + 12 - (st.gloveTap ? 8 : 0); // glove
  ctx.strokeStyle = "#14141b"; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(MX - 8, shY + 2); ctx.lineTo(gx, gy); ctx.stroke();
  ctx.fillStyle = "#0f0f15";
  ctx.beginPath(); ctx.arc(gx, gy, 8, 0, 7); ctx.fill();
  ctx.strokeStyle = "rgba(255,122,26,0.35)"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(gx, gy, 8, 0, 7); ctx.stroke();

  const [hx, hy] = st.hand; // throwing arm
  ctx.strokeStyle = "#14141b"; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(MX + 8, shY + 2); ctx.lineTo(hx, hy); ctx.stroke();

  if (st.ballIn === "glove") drawMiniBall(gx, gy - 3, 3);
  else if (st.ballIn === "hand") drawMiniBall(hx, hy, 3);

  return { gx, gy, hx, hy };
}

function setPose(tap){
  return { hand:[MX + 16, MY - 30], lift:0, crouch:0, gloveTap:tap, ballIn:"glove" };
}

/* ---------- ball ---------- */
function drawBall(x, y, r){
  ctx.save();
  ctx.shadowColor = "rgba(255,255,255,0.55)"; ctx.shadowBlur = 14;
  ctx.fillStyle = "#f4f2ec";
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = "#c8321e"; ctx.lineWidth = Math.max(1, r * 0.1);
  ctx.beginPath(); ctx.arc(x - r * 0.35, y, r * 0.72, -0.9, 0.9); ctx.stroke();
  ctx.beginPath(); ctx.arc(x + r * 0.35, y, r * 0.72, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();
}

function drawTrail(alpha){
  for (let i = 0; i < trail.length; i++){
    const p = trail[i], a = (i + 1) / trail.length * alpha;
    ctx.fillStyle = "rgba(244,242,236," + a.toFixed(2) + ")";
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.7, 0, 7); ctx.fill();
  }
}

function pitchBallAt(sp, p){
  const x = REL[0] + (PLATE_X - REL[0]) * p + sp.breakX * Math.pow(p, 3);
  const y = REL[1] + (PLATE_Y - REL[1]) * p + sp.breakY * Math.pow(p, 2.2);
  const r = 2 + 13 * Math.pow(p, 1.7);
  return { x, y, r };
}

function battedAt(sp, u){
  const sx = PLATE_X, sy = 622, tx = sp.to[0], ty = sp.to[1];
  const x = sx + (tx - sx) * u;
  const lift = sp.kind === "fly" ? 200 : 60;
  const y = sy + (ty - sy) * u - Math.sin(u * Math.PI) * lift;
  const r = 14 - 11 * u;
  return { x, y, r };
}

function drawBatStreak(a){
  ctx.save();
  ctx.globalAlpha = 0.9 * (1 - a);
  ctx.lineCap = "round";
  ctx.strokeStyle = "rgba(255,122,26,0.45)"; ctx.lineWidth = 20;
  ctx.beginPath(); ctx.moveTo(118, 752); ctx.quadraticCurveTo(245, 705, 378, 596); ctx.stroke();
  ctx.strokeStyle = "#ffe2b8"; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(118, 752); ctx.quadraticCurveTo(245, 705, 378, 596); ctx.stroke();
  ctx.restore();
}

function drawRing(x, y, t, col){
  const a = 1 - t;
  ctx.strokeStyle = col.replace("A", (a * 0.9).toFixed(2));
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(x, y, 22 + t * 58, 0, 7); ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255," + (a * 0.14).toFixed(2) + ")";
  ctx.fillRect(0, 0, LW, LH);
}

/* ---------- text ---------- */
function drawChrome(){
  ctx.textAlign = "left"; ctx.fillStyle = TXT;
  ctx.font = "800 13px -apple-system, sans-serif";
  ctx.fillText("BATTER'S VIEW", 16, 30);
  ctx.fillStyle = DIM; ctx.font = "700 11px -apple-system, sans-serif";
  ctx.fillText("V2 — LOW BOX POV", 16, 48);
  ctx.textAlign = "center"; ctx.fillStyle = "rgba(154,151,168,0.75)";
  ctx.font = "700 11px -apple-system, sans-serif";
  ctx.fillText("TAP TO SKIP", LW / 2, LH - 18);
}

function drawPitchTag(sp){
  ctx.textAlign = "right";
  ctx.fillStyle = "rgba(255,122,26,0.9)"; ctx.font = "900 15px -apple-system, sans-serif";
  ctx.fillText(sp.label, LW - 16, 32);
  ctx.fillStyle = DIM; ctx.font = "700 12px -apple-system, sans-serif";
  ctx.fillText(sp.velo + " MPH", LW - 16, 50);
}

function drawOutcome(tag, u){
  const a = Math.sin(Math.min(1, u) * Math.PI);
  ctx.save();
  ctx.globalAlpha = Math.max(0, a);
  ctx.textAlign = "center";
  ctx.font = "900 21px -apple-system, sans-serif";
  ctx.fillStyle = TXT;
  ctx.shadowColor = "rgba(0,0,0,0.7)"; ctx.shadowBlur = 10;
  ctx.fillText(tag, 210, 470);
  ctx.restore();
}

/* ---------- main loop ---------- */
function frame(){
  const sp = SCRIPT[idx % SCRIPT.length];
  const t = now() - t0;

  const lookEnd   = T_LOOK;
  const windEnd   = lookEnd + T_WIND;
  const throwEnd  = windEnd + T_THROW;
  const relT      = lookEnd + T_WIND + T_REL;
  const flightEnd = relT + sp.flight;
  const outMs     = (sp.outcome === "contact" && sp.kind === "fly") ? 1500 : 1050;
  const outEnd    = flightEnd + outMs;
  const endT      = outEnd + T_RESET;

  if (t >= endT){ idx++; startPitch(); requestAnimationFrame(frame); return; }

  /* scene */
  drawSky(); drawWall(); drawGrass(); drawMoundDirt(); drawForeDirt();
  drawChalk(); drawPlate();

  /* pitcher + ball state */
  let pst, ballInFlight = false, ballP = 0, zoneHot = false;

  if (t < lookEnd){                                   // look-in beat
    const tap = (t > 550 && t < 950) ? Math.sin((t - 550) / 400 * Math.PI) > 0.4 : false;
    pst = setPose(tap);
  } else if (t < windEnd){                            // windup: leg lift, hands rise
    const pt = (t - lookEnd) / T_WIND;
    pst = { hand: sampleKeys(WINDUP_KEYS, t - lookEnd), lift: sstep(pt),
            crouch: 4 * Math.sin(pt * Math.PI), gloveTap: false, ballIn: "hand" };
  } else if (t < throwEnd){                           // throw: arm whips, release at T_REL
    const pt = (t - windEnd) / T_THROW;
    pst = { hand: sampleKeys(THROW_KEYS, t - windEnd), lift: Math.max(0, 1 - pt * 3),
            crouch: 0, gloveTap: false, ballIn: (t - windEnd) < T_REL ? "hand" : null };
  } else {                                            // follow-through / settled
    pst = { hand:[MX - 16, MY - 22], lift:0, crouch:0, gloveTap:false, ballIn:null };
  }
  if (t >= outEnd - T_RESET + 500) pst.ballIn = "glove"; // ball back for next pitch

  drawPitcher(pst);

  /* pitch flight */
  if (t >= relT && t < flightEnd){
    ballInFlight = true; zoneHot = true;
    ballP = (t - relT) / sp.flight;
    const b = pitchBallAt(sp, Math.min(1, ballP));
    trail.push(b); if (trail.length > 12) trail.shift();
    drawTrail(0.30);
    drawBall(b.x, b.y, b.r);
  } else if (sp.outcome === "take" && t >= flightEnd && t < flightEnd + 260){
    // take: ball runs past the zone, fading
    const u = (t - flightEnd) / 260;
    const b = pitchBallAt(sp, 1 + u * 0.18);
    ctx.globalAlpha = 1 - u;
    drawBall(b.x, b.y, b.r);
    ctx.globalAlpha = 1;
  }
  drawZone(zoneHot);

  /* outcome */
  if (t >= flightEnd && t < outEnd){
    const ot = (t - flightEnd) / outMs;
    if (sp.outcome === "whiff"){
      if (t - flightEnd < 150) drawBatStreak((t - flightEnd) / 150);
      drawRing(PLATE_X, PLATE_Y - 8, Math.min(1, (t - flightEnd) / 260), "rgba(255,255,255,A)");
      drawOutcome("SWING AND A MISS", ot);
    } else if (sp.outcome === "take"){
      drawOutcome("BALL", ot);
    } else { // contact: ball launches back into the field
      if (t - flightEnd < 150){
        drawBatStreak((t - flightEnd) / 150);
        drawRing(PLATE_X, 622, Math.min(1, (t - flightEnd) / 260), "rgba(255,176,58,A)");
      }
      const b = battedAt(sp, sstep(ot));
      trail.push(b); if (trail.length > 16) trail.shift();
      drawTrail(0.35);
      drawBall(b.x, b.y, b.r);
      drawOutcome(sp.tag, ot);
    }
  }

  /* chrome */
  if (t >= lookEnd && t < flightEnd) drawPitchTag(sp);
  drawChrome();
  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
